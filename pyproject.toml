[project]
name = "ai-daily-digest"
version = "0.2.0"
description = "Versioned, webpage-grounded AI learning digest across 9 categories."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "browser-cookie3>=0.20.1",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
ai-daily-digest = "ai_daily_digest.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_daily_digest"]
