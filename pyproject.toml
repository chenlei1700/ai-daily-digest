[project]
name = "ai-daily-digest"
version = "0.1.0"
description = "Daily AI-domain digest across 5 categories with incremental dedup."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "browser-cookie3>=0.20.1",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
# Only needed if you want the legacy API-call path (summarize.py).
# In default skill mode, Claude writes summaries.json directly — no SDK needed.
api = ["anthropic>=0.40.0"]

[project.scripts]
ai-daily-digest = "ai_daily_digest.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_daily_digest"]
